<header class="navbar" [class.navbar--scrolled]="scrolled()">
  <div class="navbar__inner container">
    <a routerLink="/" class="navbar__logo" (click)="closeMenu()">
      ESTYRAS<span>COLLECTION</span>
    </a>

    <nav class="navbar__links" [class.navbar__links--open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">Home</a>
      <a routerLink="/shop" routerLinkActive="active" (click)="closeMenu()">Shop</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
    </nav>

    <div class="navbar__actions">
      <button
        class="navbar__theme-toggle"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (themeService.theme() === 'dark') {
          <i class="fas fa-sun"></i>
        } @else {
          <i class="fas fa-moon"></i>
        }
      </button>
      <button class="navbar__burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
